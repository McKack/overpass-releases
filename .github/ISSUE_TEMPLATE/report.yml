name: Problem report
description: Report a problem with a game or app. Start it from OverPass with Report Issue…, which fills in the details.
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        Start reports from OverPass: right-click the app and choose **Report Issue…**. OverPass saves a zip with
        the log on your Desktop and opens this form with the details below filled in. Reports without the zip, or
        with a changed details block, are closed automatically; editing the issue to fix it reopens it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Start the game
        2. Load a save
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Drag the "OverPass Logs – … .zip" from your Desktop into this box. It has your name taken out.
      placeholder: Drop the zip here.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Details
      description: Filled in by OverPass. Don't change it; it carries a checksum.
      render: text
    validations:
      required: true
